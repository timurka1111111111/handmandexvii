<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firestore</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    #status {
      padding: 15px;
      background: white;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }

    pre {
      background: #222;
      color: #0f0;
      padding: 15px;
      overflow: auto;
    }
  </style>

</head>

<body>

  <h1>Firestore — коллекция 123</h1>

  <div id="status">Подключение к Firebase...</div>

  <pre id="result"></pre>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBeDVmRsPo8UGgpIpo6s2QqxAP8E7q-6Hs",
      authDomain: "openko-62d24.firebaseapp.com",
      projectId: "openko-62d24"
    };


    const status = document.getElementById("status");
    const result = document.getElementById("result");


    try {

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      status.textContent = "Firebase подключен. Загружаю коллекцию 123...";


      const snapshot = await getDocs(
        collection(db, "123")
      );


      const data = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));


      status.className = "success";
      status.textContent =
        `Готово! Найдено документов: ${data.length}`;


      result.textContent =
        JSON.stringify(data, null, 2);


    } catch (error) {

      console.error(error);

      status.className = "error";

      status.textContent =
        "ОШИБКА: " + error.code;

      result.textContent =
        error.message;

    }

  </script>

</body>
</html>
